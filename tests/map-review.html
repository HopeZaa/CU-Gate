<!doctype html><html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;font:12px system-ui}#map{position:absolute;inset:0}#views{position:absolute;top:12px;left:12px;z-index:4;background:white;padding:8px;border-radius:8px}button{padding:7px;cursor:pointer}.b{border-radius:5px;background:#cc3e55;color:white;padding:3px;font-size:10px;border:1px solid white}.context{background:#ffffffe0;color:#123;font-size:10px;padding:2px;pointer-events:none;max-width:100px;text-align:center}.road{background:#def9;font-size:11px}#info{position:absolute;bottom:20px;left:12px;width:360px;max-height:180px;overflow:auto;z-index:3;background:white;padding:10px;white-space:pre-wrap}</style><div id="map"></div><div id="views"><button id="north">Health north</button><button id="dental">Dental/Pharmacy</button><button id="indoor">Indoor/West</button><button id="cham">Chamchuri 9 / Square</button><button id="south">Engineering/South</button></div><div id="info">QA: map candidates, not gate access confirmation. Building label centres are context only.</div><script type="module">
import maplibregl from 'maplibre-gl';import 'maplibre-gl/dist/maplibre-gl.css';
const data=await(await fetch('/tests/map-candidates.json')).json();
const map=new maplibregl.Map({container:'map',style:{version:8,sources:{campus:{type:'geojson',data:'/campus.geojson'}},layers:[{id:'bg',type:'background',paint:{'background-color':'#f1efe9'}},{id:'green',type:'fill',source:'campus',filter:['==',['get','kind'],'green'],paint:{'fill-color':'#d6e6c9'}},{id:'buildings',type:'fill',source:'campus',filter:['==',['get','kind'],'building'],paint:{'fill-color':'#d5d0cc','fill-outline-color':'#aaa'}},{id:'roads',type:'line',source:'campus',filter:['==',['get','kind'],'road'],paint:{'line-color':'#fff','line-width':['interpolate',['linear'],['zoom'],14,2,18,14]}}]},center:[100.5272,13.7446],zoom:16.5});
map.addControl(new maplibregl.NavigationControl());
const views={cham:[100.5274,13.7347,18],north:[100.5272,13.7451,17],dental:[100.533,13.743,17],indoor:[100.5267,13.739,17],south:[100.5308,13.7358,17]};
for(const [id,v] of Object.entries(views))document.getElementById(id).onclick=()=>map.jumpTo({center:v.slice(0,2),zoom:v[2]});
map.on('load',()=>{for(const p of data.context){if(p.kind==='road'&&p.name.length>30)continue;if(p.kind==='building'&&!/[ก-๙]|Faculty|Stadium|Sasin|Chula|College/.test(p.name))continue;const el=document.createElement('div');el.className='context '+(p.kind==='road'?'road':'');el.textContent=p.name;new maplibregl.Marker({element:el}).setLngLat([p.longitude,p.latitude]).addTo(map)}for(const p of data.barriers){const el=document.createElement('button');el.className='b';el.textContent=p.id;el.title=JSON.stringify(p.tags);el.onclick=()=>{document.getElementById('info').textContent=JSON.stringify(p,null,2)};new maplibregl.Marker({element:el}).setLngLat([p.longitude,p.latitude]).addTo(map)}});
</script></html>
